# Safety checks for incoming pull requests, including those from forks.
#
# Deliberately uses `pull_request`, NOT `pull_request_target`. `pull_request`
# runs fork code with NO access to repository secrets and a read-only token.
# `pull_request_target` would run it against the base branch WITH secrets —
# the "pwn request" pattern that has leaked credentials from major projects.
# Never change this trigger.

name: PR Safety Checks

on:
  pull_request:
    branches: [main, develop]

# Least privilege: nothing here needs write access.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # gitleaks needs history to scan the full diff
      # Uses the gitleaks CLI, not gitleaks-action. The action requires a paid
      # licence for repositories owned by an organisation ("[MoleCare] is an
      # organization. License key is required."), which fails every PR. The CLI
      # is MIT-licensed and free, and `detect` still scans the full git history
      # -- which is the point, given this repo once carried a key in history.
      - name: Scan for committed secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
          gitleaks detect --source . --redact --verbose --exit-code 1

  no-sensitive-data:
    name: Sensitive data check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Block credential and key files
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FILES=$(git diff --name-only --diff-filter=AM "$BASE" "$HEAD")
          echo "Files changed:"; echo "$FILES" | sed 's/^/  /'

          BAD=$(echo "$FILES" | grep -iE '\.(pem|key|p12|pfx)$|service-account.*\.json$|kaggle\.json$|(^|/)\.env' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Credential or key files must never be committed:"
            echo "$BAD" | sed 's/^/  /'
            exit 1
          fi
          echo "No credential file paths in this pull request."

      - name: Warn on notebook output images
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          NBS=$(git diff --name-only --diff-filter=AM "$BASE" "$HEAD" | grep '\.ipynb$' || true)
          if [ -z "$NBS" ]; then echo "No notebooks changed."; exit 0; fi
          FOUND=0
          for nb in $NBS; do
            n=$(python3 -c 'import json,sys; nb=json.load(open(sys.argv[1],encoding="utf-8")); print(sum(1 for c in nb.get("cells",[]) for o in c.get("outputs",[]) for k in (o.get("data") or {}) if k.startswith("image/")))' "$nb" 2>/dev/null || echo 0)
            if [ "${n:-0}" -gt 0 ]; then
              echo "::warning file=$nb::Contains $n embedded output image(s). A maintainer must confirm these are plots, not patient or user data."
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then echo "Notebook outputs present - flagged for maintainer review."; else echo "No embedded notebook output images."; fi

      - name: Block oversized files
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FAIL=0
          for f in $(git diff --name-only --diff-filter=AM "$BASE" "$HEAD"); do
            [ -f "$f" ] || continue
            sz=$(wc -c < "$f")
            if [ "$sz" -gt 5242880 ]; then
              echo "::error file=$f::$((sz/1048576))MB exceeds the 5MB limit. Publish model weights via GitHub Releases instead."
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] && echo "No oversized files." || exit 1

  lint:
    name: Lint and hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
