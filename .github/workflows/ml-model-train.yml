name: ML Model Training

on:
  # Manual trigger with parameters
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Model architecture to train'
        required: true
        default: 'EfficientNetB4'
        type: choice
        options:
          - EfficientNetB4
          - Xception
          - EfficientNetV2S
      model_version:
        description: 'Model version tag'
        required: true
        default: 'v2.0.0'
        type: string
      epochs_stage1:
        description: 'Epochs for head training (stage 1)'
        required: false
        default: '20'
        type: string
      epochs_stage2:
        description: 'Epochs for fine-tuning (stage 2)'
        required: false
        default: '30'
        type: string
      deploy_threshold_auc:
        description: 'Minimum AUC to auto-deploy'
        required: false
        default: '0.90'
        type: string
      auto_deploy:
        description: 'Auto-deploy if threshold met'
        required: false
        default: true
        type: boolean

  # Scheduled training (weekly on Sunday at 2 AM UTC)
  schedule:
    - cron: '0 2 * * 0'

  # Trigger on data changes
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'flows/training_flow.py'

# Least privilege: GITHUB_TOKEN defaults to broad write without this.
# Jobs that need more request it explicitly.
permissions:
  contents: read

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: molecare-ml
  S3_BUCKET: molecare-ml-artifacts-staging
  PYTHON_VERSION: '3.12'

jobs:
  # Validate inputs and prepare environment
  prepare:
    runs-on: ubuntu-latest
    outputs:
      model_name: ${{ steps.params.outputs.model_name }}
      model_version: ${{ steps.params.outputs.model_version }}
      epochs_stage1: ${{ steps.params.outputs.epochs_stage1 }}
      epochs_stage2: ${{ steps.params.outputs.epochs_stage2 }}
      deploy_threshold_auc: ${{ steps.params.outputs.deploy_threshold_auc }}
      auto_deploy: ${{ steps.params.outputs.auto_deploy }}
      run_id: ${{ steps.params.outputs.run_id }}
    steps:
      - name: Set training parameters
        id: params
        run: |
          # Use inputs if manual trigger, otherwise use defaults
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "model_name=${{ inputs.model_name }}" >> $GITHUB_OUTPUT
            echo "model_version=${{ inputs.model_version }}" >> $GITHUB_OUTPUT
            echo "epochs_stage1=${{ inputs.epochs_stage1 }}" >> $GITHUB_OUTPUT
            echo "epochs_stage2=${{ inputs.epochs_stage2 }}" >> $GITHUB_OUTPUT
            echo "deploy_threshold_auc=${{ inputs.deploy_threshold_auc }}" >> $GITHUB_OUTPUT
            echo "auto_deploy=${{ inputs.auto_deploy }}" >> $GITHUB_OUTPUT
          else
            # Defaults for scheduled/push triggers
            echo "model_name=EfficientNetB4" >> $GITHUB_OUTPUT
            echo "model_version=v2.0.0-$(date +%Y%m%d)" >> $GITHUB_OUTPUT
            echo "epochs_stage1=20" >> $GITHUB_OUTPUT
            echo "epochs_stage2=30" >> $GITHUB_OUTPUT
            echo "deploy_threshold_auc=0.90" >> $GITHUB_OUTPUT
            echo "auto_deploy=true" >> $GITHUB_OUTPUT
          fi
          echo "run_id=${{ github.run_id }}" >> $GITHUB_OUTPUT

      - name: Log parameters
        run: |
          echo "Training Configuration:"
          echo "  Model: ${{ steps.params.outputs.model_name }}"
          echo "  Version: ${{ steps.params.outputs.model_version }}"
          echo "  Stage 1 Epochs: ${{ steps.params.outputs.epochs_stage1 }}"
          echo "  Stage 2 Epochs: ${{ steps.params.outputs.epochs_stage2 }}"
          echo "  Deploy Threshold AUC: ${{ steps.params.outputs.deploy_threshold_auc }}"
          echo "  Auto Deploy: ${{ steps.params.outputs.auto_deploy }}"

  # Run ML training via Metaflow
  train:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hours max for training
    outputs:
      auc_score: ${{ steps.training.outputs.auc_score }}
      model_path: ${{ steps.training.outputs.model_path }}
      should_deploy: ${{ steps.training.outputs.should_deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: |
          cd MoleCare-ML
          pip install --upgrade pip
          pip install -r requirements.lock
          pip install kaggle

      - name: Configure Metaflow for AWS
        run: |
          mkdir -p ~/.metaflowconfig
          cat > ~/.metaflowconfig/config.json << EOF
          {
            "METAFLOW_DEFAULT_DATASTORE": "s3",
            "METAFLOW_DATASTORE_SYSROOT_S3": "s3://${{ env.S3_BUCKET }}/metaflow",
            "METAFLOW_DEFAULT_METADATA": "service",
            "METAFLOW_SERVICE_URL": "${{ secrets.METAFLOW_SERVICE_URL }}",
            "METAFLOW_SERVICE_AUTH_KEY": "${{ secrets.METAFLOW_SERVICE_AUTH_KEY }}"
          }
          EOF

      - name: Configure Kaggle credentials
        run: |
          mkdir -p ~/.kaggle
          echo '${{ secrets.KAGGLE_JSON }}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Initialize W&B
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          wandb login --relogin $WANDB_API_KEY

      - name: Run Metaflow training flow
        id: training
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          AWS_S3_BUCKET: ${{ env.S3_BUCKET }}
          MODEL_NAME: ${{ needs.prepare.outputs.model_name }}
          MODEL_VERSION: ${{ needs.prepare.outputs.model_version }}
          EPOCHS_STAGE1: ${{ needs.prepare.outputs.epochs_stage1 }}
          EPOCHS_STAGE2: ${{ needs.prepare.outputs.epochs_stage2 }}
          DEPLOY_THRESHOLD_AUC: ${{ needs.prepare.outputs.deploy_threshold_auc }}
        run: |
          cd MoleCare-ML

          # Run the Metaflow training flow
          python flows/training_flow.py run \
            --model_name "$MODEL_NAME" \
            --version "$MODEL_VERSION" \
            --epochs_stage1 "$EPOCHS_STAGE1" \
            --epochs_stage2 "$EPOCHS_STAGE2" \
            --deploy_threshold_auc "$DEPLOY_THRESHOLD_AUC" \
            2>&1 | tee training_output.log

          # Extract metrics from W&B or flow output
          # Parse the final AUC score from the training output
          AUC_SCORE=$(grep -oP 'Final AUC: \K[0-9.]+' training_output.log || echo "0.0")
          MODEL_PATH="s3://${{ env.S3_BUCKET }}/models/${MODEL_NAME}/${MODEL_VERSION}/model.h5"

          echo "auc_score=$AUC_SCORE" >> $GITHUB_OUTPUT
          echo "model_path=$MODEL_PATH" >> $GITHUB_OUTPUT

          # Determine if we should deploy
          if (( $(echo "$AUC_SCORE >= $DEPLOY_THRESHOLD_AUC" | bc -l) )); then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ Model meets deployment threshold (AUC: $AUC_SCORE >= $DEPLOY_THRESHOLD_AUC)"
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "⚠️ Model below deployment threshold (AUC: $AUC_SCORE < $DEPLOY_THRESHOLD_AUC)"
          fi

      - name: Upload training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: training-logs-${{ needs.prepare.outputs.run_id }}
          path: |
            MoleCare-ML/training_output.log
            MoleCare-ML/wandb/
          retention-days: 30

      - name: Log training results to W&B
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          AUC_SCORE: ${{ steps.training.outputs.auc_score }}
          MODEL_VERSION: ${{ needs.prepare.outputs.model_version }}
          MODEL_NAME: ${{ needs.prepare.outputs.model_name }}
        run: |
          python -c "
          import os
          import wandb

          wandb.init(
              project='molecare-melanoma',
              name=f'ci-training-{os.environ[\"MODEL_VERSION\"]}',
              job_type='ci-training'
          )
          wandb.log({
              'ci/auc_score': float(os.environ.get('AUC_SCORE', 0)),
              'ci/model_version': os.environ['MODEL_VERSION'],
              'ci/model_name': os.environ['MODEL_NAME'],
              'ci/github_run_id': '${{ github.run_id }}',
              'ci/trigger': '${{ github.event_name }}'
          })
          wandb.finish()
          "

  # Evaluate model quality
  evaluate:
    needs: [prepare, train]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: |
          pip install boto3 wandb

      - name: Validate model artifacts
        env:
          MODEL_PATH: ${{ needs.train.outputs.model_path }}
        run: |
          python -c "
          import boto3
          import os

          s3 = boto3.client('s3')
          model_path = os.environ['MODEL_PATH']

          # Parse S3 path
          path_parts = model_path.replace('s3://', '').split('/', 1)
          bucket = path_parts[0]
          key = path_parts[1]

          # Check if model exists
          try:
              response = s3.head_object(Bucket=bucket, Key=key)
              size_mb = response['ContentLength'] / (1024 * 1024)
              print(f'✅ Model found: {key}')
              print(f'   Size: {size_mb:.2f} MB')
              print(f'   Last Modified: {response[\"LastModified\"]}')
          except Exception as e:
              print(f'❌ Model not found: {e}')
              exit(1)
          "

      - name: Generate evaluation report
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          AUC_SCORE: ${{ needs.train.outputs.auc_score }}
          MODEL_VERSION: ${{ needs.prepare.outputs.model_version }}
          MODEL_NAME: ${{ needs.prepare.outputs.model_name }}
          SHOULD_DEPLOY: ${{ needs.train.outputs.should_deploy }}
        run: |
          echo "# Training Evaluation Report" > evaluation_report.md
          echo "" >> evaluation_report.md
          echo "## Model Information" >> evaluation_report.md
          echo "- **Model**: $MODEL_NAME" >> evaluation_report.md
          echo "- **Version**: $MODEL_VERSION" >> evaluation_report.md
          echo "- **AUC Score**: $AUC_SCORE" >> evaluation_report.md
          echo "- **Ready for Deployment**: $SHOULD_DEPLOY" >> evaluation_report.md
          echo "" >> evaluation_report.md
          echo "## Links" >> evaluation_report.md
          echo "- [W&B Dashboard](https://wandb.ai/molecare/molecare-melanoma)" >> evaluation_report.md
          echo "- [GitHub Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> evaluation_report.md

          cat evaluation_report.md

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report-${{ needs.prepare.outputs.run_id }}
          path: evaluation_report.md

  # Trigger deployment if threshold met and auto_deploy enabled
  trigger-deploy:
    needs: [prepare, train, evaluate]
    if: needs.train.outputs.should_deploy == 'true' && needs.prepare.outputs.auto_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment workflow
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ml-model-deploy.yml',
              ref: 'main',
              inputs: {
                action: 'deploy',
                environment: 'staging',
                model_version: '${{ needs.prepare.outputs.model_version }}'
              }
            });
            console.log('✅ Triggered deployment workflow for version ${{ needs.prepare.outputs.model_version }}');

      - name: Notify deployment triggered
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          MODEL_VERSION: ${{ needs.prepare.outputs.model_version }}
          AUC_SCORE: ${{ needs.train.outputs.auc_score }}
        run: |
          pip install wandb
          python -c "
          import os
          import wandb

          wandb.init(
              project='molecare-melanoma',
              name=f'deployment-trigger-{os.environ[\"MODEL_VERSION\"]}',
              job_type='deployment'
          )
          wandb.alert(
              title='Model Deployment Triggered',
              text=f'Model {os.environ[\"MODEL_VERSION\"]} (AUC: {os.environ[\"AUC_SCORE\"]}) deployment to staging initiated.',
              level=wandb.AlertLevel.INFO
          )
          wandb.finish()
          "

  # Notify on training completion (always runs)
  notify:
    needs: [prepare, train, evaluate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TRAIN_STATUS: ${{ needs.train.result }}
          AUC_SCORE: ${{ needs.train.outputs.auc_score }}
          MODEL_VERSION: ${{ needs.prepare.outputs.model_version }}
          MODEL_NAME: ${{ needs.prepare.outputs.model_name }}
        run: |
          if [ "$TRAIN_STATUS" = "success" ]; then
            COLOR="good"
            EMOJI="✅"
            STATUS="succeeded"
          else
            COLOR="danger"
            EMOJI="❌"
            STATUS="failed"
          fi

          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "{
              \"attachments\": [{
                \"color\": \"$COLOR\",
                \"title\": \"$EMOJI ML Training $STATUS\",
                \"fields\": [
                  {\"title\": \"Model\", \"value\": \"$MODEL_NAME\", \"short\": true},
                  {\"title\": \"Version\", \"value\": \"$MODEL_VERSION\", \"short\": true},
                  {\"title\": \"AUC Score\", \"value\": \"$AUC_SCORE\", \"short\": true},
                  {\"title\": \"Trigger\", \"value\": \"${{ github.event_name }}\", \"short\": true}
                ],
                \"footer\": \"GitHub Actions\",
                \"footer_icon\": \"https://github.githubassets.com/favicon.ico\",
                \"ts\": $(date +%s)
              }]
            }"

      - name: Create GitHub summary
        env:
          TRAIN_STATUS: ${{ needs.train.result }}
          AUC_SCORE: ${{ needs.train.outputs.auc_score }}
          MODEL_VERSION: ${{ needs.prepare.outputs.model_version }}
          MODEL_NAME: ${{ needs.prepare.outputs.model_name }}
          SHOULD_DEPLOY: ${{ needs.train.outputs.should_deploy }}
          AUTO_DEPLOY: ${{ needs.prepare.outputs.auto_deploy }}
        run: |
          if [ "$TRAIN_STATUS" = "success" ]; then
            STATUS_EMOJI="✅"
          else
            STATUS_EMOJI="❌"
          fi

          if [ "$SHOULD_DEPLOY" = "true" ] && [ "$AUTO_DEPLOY" = "true" ]; then
            DEPLOY_STATUS="🚀 Deployment triggered"
          elif [ "$SHOULD_DEPLOY" = "true" ]; then
            DEPLOY_STATUS="✅ Ready for deployment"
          else
            DEPLOY_STATUS="⚠️ Below threshold"
          fi

          cat >> $GITHUB_STEP_SUMMARY << EOF
          # ML Training Summary $STATUS_EMOJI

          | Metric | Value |
          |--------|-------|
          | Model | $MODEL_NAME |
          | Version | $MODEL_VERSION |
          | AUC Score | $AUC_SCORE |
          | Status | $TRAIN_STATUS |
          | Deployment | $DEPLOY_STATUS |

          ## Links
          - [W&B Dashboard](https://wandb.ai/molecare/molecare-melanoma)
          - [Training Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF
