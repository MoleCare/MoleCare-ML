name: ML Model CI/CD

on:
  push:
    paths:
      - 'ml_model_serving/**'
      - 'flows/**'
      - 'handler.py'
      - 'Dockerfile.lambda'
      - 'requirements.txt'
      - 'Pipfile'
    branches:
      - main
      - develop
  pull_request:
    paths:
      - 'ml_model_serving/**'
      - 'flows/**'
      - 'tests/**'
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      rollback_version:
        description: 'Lambda version to rollback to (for rollback action)'
        required: false
        type: string
      model_version:
        description: 'Model version to deploy (passed from training workflow)'
        required: false
        type: string
      model_name:
        description: 'Model architecture name'
        required: false
        default: 'EfficientNetB4'
        type: string

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: molecare-ml
  PYTHON_VERSION: '3.9'

jobs:
  # ============================================================
  # Test Job - Run unit tests
  # ============================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-flask

      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=ml_model_serving --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ============================================================
  # Lint Job - Code quality checks
  # ============================================================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: |
          pip install flake8 black isort

      - name: Run flake8
        run: flake8 ml_model_serving/ flows/ --max-line-length=120 --ignore=E501,W503
        continue-on-error: true

      - name: Check formatting with black
        run: black --check ml_model_serving/ flows/ --line-length=120
        continue-on-error: true

  # ============================================================
  # Build Job - Build and push Docker image
  # ============================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    outputs:
      image_uri: ${{ steps.build-image.outputs.image_uri }}
      image_tag: ${{ steps.build-image.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build the Docker image
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -f Dockerfile.lambda \
            .

          # Push to ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          # Output image URI
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Log to W&B
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          pip install wandb
          python -c "
          import wandb
          wandb.init(project='molecare-melanoma', job_type='build', name='build-${{ github.sha }}')
          wandb.log({'build/success': True, 'build/image_tag': '${{ github.sha }}'})
          wandb.finish()
          "

  # ============================================================
  # Deploy Staging Job
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging-ml-api.molecare.co.uk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Lambda (Staging)
        run: |
          aws lambda update-function-code \
            --function-name molecare-ml-staging \
            --image-uri ${{ needs.build.outputs.image_uri }}

          # Wait for update to complete
          aws lambda wait function-updated \
            --function-name molecare-ml-staging

      - name: Publish Lambda version
        id: publish-version
        run: |
          VERSION=$(aws lambda publish-version \
            --function-name molecare-ml-staging \
            --description "Build: ${{ github.sha }}" \
            --query 'Version' \
            --output text)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update staging alias
        run: |
          aws lambda update-alias \
            --function-name molecare-ml-staging \
            --name staging \
            --function-version ${{ steps.publish-version.outputs.version }} \
            2>/dev/null || \
          aws lambda create-alias \
            --function-name molecare-ml-staging \
            --name staging \
            --function-version ${{ steps.publish-version.outputs.version }}

      - name: Run smoke tests
        run: |
          # Wait for deployment to stabilize
          sleep 10

          # Health check
          aws lambda invoke \
            --function-name molecare-ml-staging:staging \
            --payload '{}' \
            response.json

          cat response.json

      - name: Log deployment to W&B
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          pip install wandb
          python -c "
          import wandb
          wandb.init(project='molecare-melanoma', job_type='deployment', name='deploy-staging-${{ github.sha }}')
          wandb.log({
            'deploy/environment': 'staging',
            'deploy/version': '${{ steps.publish-version.outputs.version }}',
            'deploy/success': True
          })
          wandb.finish()
          "

  # ============================================================
  # Deploy Production Job (requires manual approval)
  # ============================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://ml-api.molecare.co.uk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install boto3 wandb

      - name: Deploy to Lambda (Production)
        run: |
          aws lambda update-function-code \
            --function-name molecare-ml-prod \
            --image-uri ${{ needs.build.outputs.image_uri }}

          aws lambda wait function-updated \
            --function-name molecare-ml-prod

      - name: Publish Lambda version
        id: publish-version
        run: |
          VERSION=$(aws lambda publish-version \
            --function-name molecare-ml-prod \
            --description "Production: ${{ github.sha }}" \
            --query 'Version' \
            --output text)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Canary deployment (10% traffic)
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          python scripts/canary_deploy.py start \
            --version ${{ steps.publish-version.outputs.version }} \
            --weight 0.1

      - name: Monitor canary (5 minutes)
        run: |
          echo "Monitoring canary deployment..."
          sleep 300  # 5 minutes

          # Check CloudWatch for errors
          ERROR_COUNT=$(aws cloudwatch get-metric-statistics \
            --namespace AWS/Lambda \
            --metric-name Errors \
            --dimensions Name=FunctionName,Value=molecare-ml-prod \
            --start-time $(date -u -v-5M +%Y-%m-%dT%H:%M:%SZ) \
            --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --period 300 \
            --statistics Sum \
            --query 'Datapoints[0].Sum' \
            --output text 2>/dev/null || echo "0")

          if [ "$ERROR_COUNT" != "None" ] && [ "$ERROR_COUNT" -gt 10 ]; then
            echo "High error count detected: $ERROR_COUNT"
            echo "Rolling back..."
            python scripts/canary_deploy.py rollback
            exit 1
          fi

          echo "Canary looks healthy, proceeding with full rollout"

      - name: Complete rollout (100% traffic)
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          python scripts/canary_deploy.py complete

      - name: Log deployment to W&B
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          python -c "
          import wandb
          wandb.init(project='molecare-melanoma', job_type='deployment', name='deploy-prod-${{ github.sha }}')
          wandb.log({
            'deploy/environment': 'production',
            'deploy/version': '${{ steps.publish-version.outputs.version }}',
            'deploy/success': True,
            'deploy/canary_completed': True
          })
          wandb.finish()
          "

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Production Release v${{ github.run_number }}
          body: |
            ## Production Deployment

            - **Commit**: ${{ github.sha }}
            - **Lambda Version**: ${{ steps.publish-version.outputs.version }}
            - **Docker Image**: ${{ needs.build.outputs.image_uri }}

            Deployed via canary release with automatic rollback.
          draft: false
          prerelease: false

  # ============================================================
  # Rollback Job (manual trigger)
  # ============================================================
  rollback:
    name: Rollback ${{ inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    environment:
      name: ${{ inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install boto3 wandb

      - name: Determine function name
        id: function
        run: |
          if [ "${{ inputs.environment }}" == "production" ]; then
            echo "name=molecare-ml-prod" >> $GITHUB_OUTPUT
          else
            echo "name=molecare-ml-staging" >> $GITHUB_OUTPUT
          fi

      - name: Rollback to previous version
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          FUNCTION_NAME="${{ steps.function.outputs.name }}"

          if [ -n "${{ inputs.rollback_version }}" ]; then
            # Rollback to specific version
            TARGET_VERSION="${{ inputs.rollback_version }}"
          else
            # Rollback to previous version using canary_deploy.py
            python scripts/canary_deploy.py rollback
            exit 0
          fi

          # Update alias to target version
          ALIAS_NAME="${{ inputs.environment == 'production' && 'live' || 'staging' }}"
          aws lambda update-alias \
            --function-name $FUNCTION_NAME \
            --name $ALIAS_NAME \
            --function-version $TARGET_VERSION

          echo "Rolled back $FUNCTION_NAME to version $TARGET_VERSION"

      - name: Log rollback to W&B
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version || 'previous' }}
        run: |
          python -c "
          import wandb
          import os
          wandb.init(project='molecare-melanoma', job_type='rollback', name='rollback-${{ inputs.environment }}-${{ github.run_number }}')
          wandb.log({
            'rollback/environment': '${{ inputs.environment }}',
            'rollback/version': os.environ.get('ROLLBACK_VERSION', 'previous'),
            'rollback/triggered_by': '${{ github.actor }}'
          })
          wandb.finish()
          "

  # ============================================================
  # Manual Deploy Job (workflow_dispatch with deploy action)
  # ============================================================
  manual-deploy:
    name: Manual Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -f Dockerfile.lambda \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Determine function name
        id: function
        run: |
          if [ "${{ inputs.environment }}" == "production" ]; then
            echo "name=molecare-ml-prod" >> $GITHUB_OUTPUT
          else
            echo "name=molecare-ml-staging" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ steps.function.outputs.name }} \
            --image-uri ${{ steps.build-image.outputs.image_uri }}

          aws lambda wait function-updated \
            --function-name ${{ steps.function.outputs.name }}

      - name: Publish version and update alias
        run: |
          VERSION=$(aws lambda publish-version \
            --function-name ${{ steps.function.outputs.name }} \
            --description "Manual deploy: ${{ github.sha }}" \
            --query 'Version' \
            --output text)

          ALIAS_NAME="${{ inputs.environment == 'production' && 'live' || 'staging' }}"
          aws lambda update-alias \
            --function-name ${{ steps.function.outputs.name }} \
            --name $ALIAS_NAME \
            --function-version $VERSION \
            2>/dev/null || \
          aws lambda create-alias \
            --function-name ${{ steps.function.outputs.name }} \
            --name $ALIAS_NAME \
            --function-version $VERSION

      - name: Install Metaflow dependencies
        run: pip install metaflow wandb boto3

      - name: Run Metaflow deployment flow
        if: inputs.model_version != ''
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          MODEL_VERSION: ${{ inputs.model_version }}
          MODEL_NAME: ${{ inputs.model_name || 'EfficientNetB4' }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          python flows/deployment_flow.py run \
            --version "$MODEL_VERSION" \
            --model_name "$MODEL_NAME" \
            --env "$ENVIRONMENT" \
            --triggered_by_training True

      - name: Log deployment to W&B
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          MODEL_VERSION: ${{ inputs.model_version || github.sha }}
          MODEL_NAME: ${{ inputs.model_name || 'EfficientNetB4' }}
        run: |
          python -c "
          import os
          import wandb
          wandb.init(project='molecare-melanoma', job_type='deployment', name='manual-deploy-${{ inputs.environment }}-${{ github.sha }}')
          wandb.log({
            'deploy/environment': '${{ inputs.environment }}',
            'deploy/model_version': os.environ.get('MODEL_VERSION', ''),
            'deploy/model_name': os.environ.get('MODEL_NAME', ''),
            'deploy/manual': True,
            'deploy/triggered_by': '${{ github.actor }}'
          })
          wandb.finish()
          "
