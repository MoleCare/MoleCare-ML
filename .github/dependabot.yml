version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  # Keeps pinned action SHAs current — without this, SHA pinning means
  # staying on a stale version forever.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "github-actions"]

  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "docker"]
