version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  # Keeps pinned action SHAs current — without this, SHA pinning means
  # staying on a stale version forever.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "github-actions"]

  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "docker"]
    ignore:
      # The image installs requirements.lock, which pins tensorflow==2.21.0.
      # TensorFlow publishes wheels for cp310-cp313 only, so a Python major or
      # minor bump ahead of TensorFlow's support breaks the build. Revisit when
      # TensorFlow ships wheels for the newer interpreter.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
