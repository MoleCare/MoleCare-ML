<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d">
  <title id="t">What has and has not been measured</title>
  <desc id="d">Test accuracy is measured at 0.9422. Sensitivity, specificity and AUC-ROC are not measured; their proposed minimums are 0.85, 0.80 and 0.90.</desc>
  <style>
    .bg{fill:#ffffff}.fg{fill:#1f2328}.mut{fill:#59636e}
    .track{fill:#eaeef2}.done{fill:#1a7f37}.gap{fill:none;stroke:#bf8700;stroke-width:2;stroke-dasharray:5 4}
    .lbl{font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .val{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace}
    .note{font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .hd{font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.fg{fill:#e6edf3}.mut{fill:#9198a1}
      .track{fill:#21262d}.done{fill:#3fb950}.gap{stroke:#d29922}
    }
  </style>
  <rect class="bg" width="720" height="300" rx="6"/>
  <text class="hd fg" x="24" y="34">What has and has not been measured</text>
  <text class="note mut" x="24" y="56">Xception, deployed. Held-out test split.</text>

  <g transform="translate(24,86)">
    <text class="lbl fg" x="0" y="12">Test accuracy</text>
    <rect class="track" x="200" y="0" width="330" height="16" rx="8"/>
    <rect class="done"  x="200" y="0" width="311" height="16" rx="8"/>
    <text class="val fg" x="544" y="13">0.9422</text>
  </g>

  <g transform="translate(24,128)">
    <text class="lbl fg" x="0" y="12">Sensitivity</text>
    <rect class="track" x="200" y="0" width="330" height="16" rx="8"/>
    <rect class="gap"   x="200" y="0" width="281" height="16" rx="8"/>
    <text class="val mut" x="544" y="13">not measured</text>
    <text class="note mut" x="200" y="30">target ≥ 0.85 — missing a melanoma is the harmful failure</text>
  </g>

  <g transform="translate(24,182)">
    <text class="lbl fg" x="0" y="12">Specificity</text>
    <rect class="track" x="200" y="0" width="330" height="16" rx="8"/>
    <rect class="gap"   x="200" y="0" width="264" height="16" rx="8"/>
    <text class="val mut" x="544" y="13">not measured</text>
    <text class="note mut" x="200" y="30">target ≥ 0.80</text>
  </g>

  <g transform="translate(24,236)">
    <text class="lbl fg" x="0" y="12">AUC-ROC</text>
    <rect class="track" x="200" y="0" width="330" height="16" rx="8"/>
    <rect class="gap"   x="200" y="0" width="297" height="16" rx="8"/>
    <text class="val mut" x="544" y="13">not measured</text>
    <text class="note mut" x="200" y="30">target ≥ 0.90 — best single discrimination measure</text>
  </g>
</svg>
