services:
  tensorflow-serving:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.serving
    command:
      - '--model_config_file=/models/models.conf'
    expose:
      - 8501
    depends_on:
      - web

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    volumes:
      - sql_data:/app/database
    command: gunicorn --bind 0.0.0.0:5000 wsgi
    expose:
      - 5000
  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.nginx
    ports:
      - 1337:80

volumes:
  sql_data:
